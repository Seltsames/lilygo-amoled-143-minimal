; LilyGo T-Display S3 AMOLED 1.43" (CO5300 panel) - minimal display setup

[platformio]
boards_dir = ./boards
default_envs = amoled143

[env:amoled143]
platform = espressif32 @ ^6.13.0
board = esp32s3_flash_16MB
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM7
monitor_port = COM7

; Octal PSRAM (ESP32-S3R8). qio_qspi boots but PSRAM is NOT detected.
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_16MB.csv

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1
    ; Panel model for the LilyGo GFX fork: 1.43" CO5300. Without it drawPixel()
    ; is a no-op (so circles, diagonal lines etc. don't draw).
    -D DO0143FMST10

; lib/Arduino_GFX = LilyGo's fork (has Arduino_CO5300). Upstream versions don't build here.
lib_ldf_mode = deep+
